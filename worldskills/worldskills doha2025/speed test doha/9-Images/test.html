<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Grid</title>
  <style>
   body{
    font-family: Arial, Helvetica, sans-serif;
    padding: 20p;
   }
   .container{
    max-width: 500px;
    margin: auto;
    background-color: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
   }
   .image-grid{
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap:6px;
    margin-bottom: 16px;
   }
   .image-grid img,
   .image-grid .extra{
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    border-radius: 8px;
    position: relative;
   }
   .image-grid .extra::after{
    content: attr(data-extra);
    position:absolute;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-size: 24px;
   }
  </style>

</head>
<body>

  <div class="container">
    <p>
      Lorem ipsum dolor, sit amet consectetur adipisicing elit. Blanditiis fugit magni ad cum beatae vero
      deleniti, sequi repellat qui saepe dolore, perferendis illum, dolorem quisquam repellendus. Consequuntur
      ab architecto amet?
    </p>

    <div class="image-grid" id="imageGrid">
      <!-- Images will be generated by JavaScript -->
    </div>

    <button onclick="removeFirstImage()">Remove First Image</button>
  </div>

  <script>
    const images = [
      'camal.webp', 'camel.jpg', 'camel.jpg',
      'camel.jpg', 'camel.jpg', 'camel.jpg',
      'camel.jpg', 'camel.jpg', 'camel.jpg',
      'camel.jpg', 'camel.jpg','camel.jpg'
      ,'camel.jpg' // extra images
    ];

    const grid = document.getElementById('imageGrid');

    function renderImages() {
      grid.innerHTML = '';
      const maxVisible = 9;
      const visibleImages = images.slice(0, maxVisible);
      const extraCount = images.length - maxVisible;

      visibleImages.forEach((src, index) => {
        if (index === maxVisible - 1 && extraCount > 0) {
          const div = document.createElement('div');
          div.className = 'extra';
          div.setAttribute('data-extra', `+${extraCount}`);
          const img = document.createElement('img');
          img.src = src;
          div.appendChild(img);
          grid.appendChild(div);
        } else {
          const img = document.createElement('img');
          img.src = src;
          grid.appendChild(img);
        }
      });
    }

    function removeFirstImage() {
      if (images.length > 0) {
        images.shift(); // Remove first image
        renderImages();
      }
    }

    // Initial render
    renderImages();
  </script>

</body>
</html>
