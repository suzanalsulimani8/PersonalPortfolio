<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0; display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #fff;
    }

    button {
      position: relative;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #e84393;
      color: #fff;
      cursor: pointer;
    }

    button::before {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 8px; height: 8px;
      background: #fff;
      border-radius: 50%;
      box-shadow:
        0 0 #fff, 20px -10px #fff, -15px -10px #fff,
        10px 15px #fff, -15px 15px #fff, 25px 0 #fff,
        -25px 0 #fff, 0 -20px #fff, 0 20px #fff;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
    }

    button:active::before {
      animation: pop 0.6s ease forwards;
    }

    @keyframes pop {
      0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }
  </style>
</head>
<body>ِ

  <button>Click Me!</button>

</body>
</html>
