<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Submission</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .grade { margin-top: 20px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Question and Answer Comparison</h1>

    <input type="file" id="actualFile" accept=".csv" />
    <input type="file" id="submittedFile" accept=".csv" />
    <button onclick="compare()">Compare Answers</button>

    <table id="comparisonTable">
        <thead>
            <tr><th>Question Number</th><th>Actual Answer</th><th>Submitted Answer</th></tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="grade" id="grade"></div>

    <script>
        const parseCSV = data => data.trim().split('\n').map(row => row.split(',').map(cell => cell.trim()));

        const compare = () => {
            const [actualFile, submittedFile] = [document.getElementById('actualFile').files[0], document.getElementById('submittedFile').files[0]];
            if (!actualFile || !submittedFile) return alert("Please upload both files!");

            const readCSV = file => new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => resolve(parseCSV(e.target.result));
                reader.readAsText(file);
            });

            Promise.all([readCSV(actualFile), readCSV(submittedFile)]).then(([actual, submitted]) => {
                let correct = 0, rows = '';
                actual.forEach((row, i) => {
                    const submittedAnswer = (submitted[i] && submitted[i][1]) || '';
                    rows += `<tr><td>${i + 1}</td><td>${row[1]}</td><td>${submittedAnswer}</td></tr>`;
                    if (row[1] === submittedAnswer) correct++;
                });
                document.querySelector("#comparisonTable tbody").innerHTML = rows;
                document.getElementById('grade').textContent = `Total Grade: ${correct} out of ${actual.length} (${(correct / actual.length * 100).toFixed(2)}%)`;
            });
        };
    </script>

</body>                                                            
</html>
