<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A1: CSS Grid (Level 1)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    /* Container Configuration */
    .grid-container {
      display: grid;
      width: 600px;
      height: 600px;
      margin: 20px auto;
      gap: 2px; 
      
   
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;

      grid-template-rows: 1fr 1fr 2fr 2fr 1.5fr 1fr;
      

      grid-template-areas:
        "title title title title nav1 nav2 nav3" /* Note: 7 elements distributed into grid */
    }


    .grid-container {
      display: grid;
      width: 500px;
      height: 500px;
      margin: 20px auto;
      gap: 3px;
      background-color: white;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: 0.8fr 0.8fr 1.8fr 1.8fr 1.2fr 0.8fr;
    }

    /* Styling items */
    .item {
      padding: 4px;
      font-size: 14px;
      color: black;
    }

    /* 1. Site Title */
    .site-title {
      grid-column: 1 / 4;
      grid-row: 1;
      background-color: #f1c40f; /* yellow/orange */
    }

    /* Navigation Items */
    .nav1 {
      grid-column: 4 / 5;
      grid-row: 1;
      background-color: #f8c2d4;
    }
    .nav2 {
      grid-column: 5 / 6;
      grid-row: 1;
      background-color: #f8c2d4;
    }
    .nav3 {
      grid-column: 6 / 7;
      grid-row: 1;
      background-color: #f8c2d4;
    }

    /* 2. Post Title */
    .post-title {
      grid-column: 1 / 5;
      grid-row: 2;
      background-color: #add8e6; /* light blue */
    }

    /* 3. Side Bar */
    .sidebar {
      grid-column: 5 / 7;
      grid-row: 2 / 4;
      background-color: #ff9f43; /* orange */
    }

    /* 4. Post Meta */
    .post-meta {
      grid-column: 1 / 2;
      grid-row: 3 / 6;
      background-color: #90ee90; /* light green */
    }

    /* 5. Main Content */
    .main-content {
      grid-column: 2 / 5;
      grid-row: 3;
      background-color: #d3d3d3; /* light gray */
    }

    /* 6. Main Content Image */
    .main-content-image {
      grid-column: 2 / 5;
      grid-row: 4 / 6;
      background-color: #ffff00; /* yellow */
    }

    /* 7. Ads */
    .ads {
      grid-column: 5 / 7;
      grid-row: 4;
      background-color: #008000; /* dark green */
      color: white;
    }

    /* 8. Other Stuffs */
    .other-stuffs {
      grid-column: 5 / 7;
      grid-row: 5;
      background-color: #df35f3; /* magenta/purple */
    }

    /* 9. Footer */
    .footer {
      grid-column: 1 / 7;
      grid-row: 6;
      background-color: #a08276; /* brown/gray */
    }
  </style>
</head>
<body>


    <div class="item site-title">Site Title</div>
    <div class="item nav1">Nav 1</div>
    <div class="item nav2">Nav 2</div>
    <div class="item nav3">Nav 3</div>
    
    <div class="item post-title">Post Title</div>
    <div class="item sidebar">Side Bar</div>
    
    <div class="item post-meta">Post Meta</div>
    <div class="item main-content">Main Content</div>
    
    <div class="item main-content-image">Main Content Image</div>
    <div class="item ads">Ads</div>
    
    <div class="item other-stuffs">Other Stuffs</div>
    
    <div class="item footer">footer</div>


</body>
</html>
