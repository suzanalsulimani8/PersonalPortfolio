<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Equation Solver</title>
    <style>body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    
    .container {
        background: white;
        padding: 20px 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: 100%;
    }
    
    h1 {
        font-size: 24px;
        margin-bottom: 10px;
    }
    
    label {
        display: block;
        margin: 10px 0 5px;
        font-size: 16px;
        text-align: left;
    }
    
    input[type="number"] {
        width: 100%;
        padding: 8px;
        font-size: 16px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
    }
    
    button {
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        padding: 10px 15px;
        font-size: 16px;
        cursor: pointer;
        width: 100%;
    }
    
    button:hover {
        background-color: #218838;
    }
    
    #result {
        font-size: 18px;
        font-weight: bold;
        margin-top: 20px;
        color: #333;
    }</style>
</head>
<body>
    <div class="container">
        <h1>Equation</h1>
        <p>Enter the coefficients of the equation (kx + b = 0):</p>
        <form id="equation-form">
            <label for="k">Coefficient (k):</label>
            <input type="number" id="k" name="k" placeholder="Input k" required>
            <label for="b">Coefficient (b):</label>
            <input type="number" id="b" name="b" placeholder="Input b" required>
            <button type="submit">Solve</button>
        </form>
        <p id="result">Result is:</p>
    </div>
    <script >
        document.getElementById('equation-form').addEventListener('submit', function (event) {
    event.preventDefault();

    // Get values of k and b
    const k = parseFloat(document.getElementById('k').value);
    const b = parseFloat(document.getElementById('b').value);

    // Calculate the solution
    let resultText = '';
    if (k === 0 && b === 0) {
        resultText = 'The equation has infinitely many solutions.';
    } else if (k === 0 && b !== 0) {
        resultText = 'The equation has no solution.';
    } else {
        const solution = -b / k;
        resultText = `The solution is x = ${solution.toFixed(2)}`;
    }

    // Display the result
    document.getElementById('result').textContent = resultText;
});
    </script>
</body>
</html>
