<!DOCTYPE html>
<html>
<head>
<style>
.dots { display: flex; }
.dot { width: 10px; height: 10px; background: blue; border-radius: 50%; margin: 0 5px; animation: pulse 1s ease-in-out infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="dots">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>
</body>
</html>
