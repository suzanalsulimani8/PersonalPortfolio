<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #passwordContainer {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: monospace;
        }
        #symbolPassword {
            font-size: 18px;
            padding: 6px 10px;
            width: 300px;
            border-radius: 6px;
            border: 1.5px solid #666;
            letter-spacing: 0.25em;
            outline-offset: 3px;
        }
        #symbolPassword:focus {
            border-color: #1e88e5;
            box-shadow: 0 0 8px #1e88e5aa;
        }
        #toggleReveal {
            padding: 6px 12px;
            border: none;
            background-color: #1e88e5;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s ease;
        }
        #toggleReveal:hover {
            background-color: #1565c0;
        }
    </style>
</head>
<body>
    <div id="passwordContainer">
        <input id="symbolPassword" type="text" autocomplete="off" spellcheck="false" aria-label="Password" />
        <button id="toggleReveal" aria-label="Toggle password visibility">Show</button>
    </div>
    <script>
        (() => {
            const input = document.getElementById('symbolPassword');
            const toggleBtn = document.getElementById('toggleReveal');
            const symbols = ['@', '#', '$', '%', '^', '&', '*', '!', '?', '~', '+', '=', 'µ'];
            let realPassword = [];
            let showingReal = false;
            function getRandomSymbol() {
                return symbols[Math.floor(Math.random() * symbols.length)];
            }
            function renderDisplay() {
                if (showingReal) {
                    input.value = realPassword.join('');
                } else {
                    input.value = realPassword.map(() => getRandomSymbol()).join('');
                }
            }
            function setCursorPosition(pos) {
                requestAnimationFrame(() => {
                    input.setSelectionRange(pos, pos);
                });
            }
            input.addEventListener('keydown', (e) => {
                if (showingReal) return;
                const cursorPos = input.selectionStart;
                const pressedKey = e.key;
                if (pressedKey.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    e.preventDefault();
                    realPassword.splice(cursorPos, 0, pressedKey);
                    renderDisplay();
                    setCursorPosition(cursorPos + 1);
                }
                else if (pressedKey === 'Backspace') {
                    e.preventDefault();
                    if (cursorPos > 0) {
                        realPassword.splice(cursorPos - 1, 1);
                        renderDisplay();
                        setCursorPosition(cursorPos - 1);
                    }
                }
                else if (pressedKey === 'Delete') {
                    e.preventDefault();
                    if (cursorPos < realPassword.length) {
                        realPassword.splice(cursorPos, 1);
                        renderDisplay();
                        setCursorPosition(cursorPos);
                    }
                }
            });
            input.addEventListener('input', () => {
                if (showingReal) {
                    realPassword = input.value.split('');
                }
            });
            toggleBtn.addEventListener('click', () => {
                showingReal = !showingReal;
                toggleBtn.textContent = showingReal ? 'Hide' : 'Show';
                renderDisplay();
                setCursorPosition(realPassword.length);
                input.focus();
            });
            renderDisplay();
        })();
    </script>
</body>
</html>
