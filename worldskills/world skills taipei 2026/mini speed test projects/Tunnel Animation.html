<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D Tunnel Animation - Rings same level</title>
<style>
  body, html {
    margin: 0; padding: 0; height: 100%;
    background-color: black;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
  }

  .tunnel {
    position: relative;
    width: 600px;
    height: 200px;
    perspective: 800px;
  }

  .ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 160px;
    height: 160px;
    border: 3px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    transform-origin: center center;
    opacity: 0;
    animation-name: tunnelMove;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    transform: translate(-50%, -50%) scale(0); /* start scale zero */
  }

  /* Stagger animation delays for continuous effect */
  .ring:nth-child(1) { animation-duration: 4s; animation-delay: 0s; }
  .ring:nth-child(2) { animation-duration: 4s; animation-delay: 1s; }
  .ring:nth-child(3) { animation-duration: 4s; animation-delay: 2s; }
  .ring:nth-child(4) { animation-duration: 4s; animation-delay: 3s; }

  @keyframes tunnelMove {
    0% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0);
      border-color: rgba(255, 255, 255, 0);
    }
    10% {
      opacity: 0.3;
      border-color: rgba(255, 255, 255, 0.3);
    }
    50% {
      opacity: 0.8;
      border-color: rgba(255, 255, 255, 0.8);
    }
    90% {
      opacity: 0.3;
      border-color: rgba(255, 255, 255, 0.3);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(2.5);
      border-color: rgba(255, 255, 255, 0);
    }
  }
</style>
</head>
<body>
  <div class="tunnel">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </div>
</body>
</html>
